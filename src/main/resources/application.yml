spring:
  application:
    name: RemoteUpdateBackend

  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/remote_update}
    username: ${DB_USERNAME:remote_update}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      # 3일 개발 기간 동안은 update로 스키마를 맞추고, 운영 전 validate + 스키마 스크립트로 전환
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 510MB
      # 일정 크기 이상은 메모리 대신 임시 파일로 받음
      file-size-threshold: 2MB

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        # HTTPS 로 운영할 때는 true (쿠키가 암호화된 연결에서만 전송됨). http 로 접속하는 개발 환경에서는 false
        secure: ${COOKIE_SECURE:false}
  tomcat:
    # 크기 초과 업로드 시 연결을 끊지 않고 오류 응답을 돌려주기 위함
    max-swallow-size: -1

app:
  storage:
    # 업로드 파일 저장 위치 (추후 오브젝트 스토리지로 교체 가능하도록 추상화 예정)
    root: ${STORAGE_ROOT:./storage}
  upload:
    # [확정 필요] Open Question #1 — 현재는 기획서 가정값
    allowed-extensions: zip, exe, msi, pdf, md
  security:
    login:
      # [확정 필요] Open Question #3 — 현재는 기획서 예시값
      max-failures: 5
      lock-duration: 15m
    ip-filter:
      # 관리 기능 IP 제한. 켜기 전에 관리자 화면 "허용 IP"에서 사무실 IP 를 먼저 등록할 것 (docs/operations.md)
      enabled: ${IP_FILTER_ENABLED:false}
      # 서버 PC 자신에서 접속하면 항상 허용 (복구 경로)
      always-allow-localhost: true
      # 리버스 프록시를 쓰는 경우에만 프록시 IP를 넣음 (X-Forwarded-For 신뢰 대상)
      trusted-proxies: []
  seed:
    admin:
      # 최초 기동 시 관리자 계정이 없으면 생성. 첫 로그인 시 비밀번호 변경 강제
      email: ${ADMIN_EMAIL:admin@onpoom.co.kr}
      name: ${ADMIN_NAME:시스템 관리자}
      password: ${ADMIN_PASSWORD:ChangeMe!2026}
      # 관리자 복구: true 로 한 번 실행하면 위 이메일 계정을 위 비밀번호로 초기화 (docs/operations.md). 복구 후 반드시 false
      reset-on-start: ${ADMIN_RESET_ON_START:false}
  frontend:
    # 운영 배포: Frontend 빌드 결과(dist) 폴더. 지정하면 이 서버(8080)가 화면도 함께 제공 (개발 중에는 비워 둠)
    dist-dir: ${FRONTEND_DIST:}

logging:
  level:
    com.onpoom.remoteupdate: DEBUG
